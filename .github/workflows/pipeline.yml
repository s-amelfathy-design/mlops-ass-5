name: Model Validation and Deployment Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: file:./mlruns

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pull data with DVC
        run: dvc pull --allow-missing

      - name: Ensure training dataset exists
        run: |
          if [ ! -f data/data.csv ]; then
            python make_data.py
          fi
          ls -la data

      - name: Train model and log to MLflow
        run: python train.py

      - name: Verify model_info.txt exists
        run: |
          test -f model_info.txt
          echo "model_info.txt found"
          cat model_info.txt

      - name: Pack mlruns
        run: tar -czf mlruns.tar.gz mlruns

      - name: Upload model_info artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-info
          path: model_info.txt

      - name: Upload mlruns archive
        uses: actions/upload-artifact@v4
        with:
          name: mlruns-archive
          path: mlruns.tar.gz

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: file:./mlruns

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download model_info artifact
        uses: actions/download-artifact@v4
        with:
          name: model-info
          path: .

      - name: Download mlruns archive
        uses: actions/download-artifact@v4
        with:
          name: mlruns-archive
          path: .

      - name: Extract mlruns
        run: |
          tar -xzf mlruns.tar.gz
          ls -la
          ls -la mlruns
          cat model_info.txt

      - name: Pull data with DVC
        run: dvc pull --allow-missing

      - name: Ensure training dataset exists
        run: |
          if [ ! -f data/data.csv ]; then
            python make_data.py
          fi
          ls -la data

      - name: Check threshold in MLflow
        run: python check_threshold.py

      - name: Mock Docker build
        run: echo "Building Docker image for Run ID: $(cat model_info.txt)"

      - name: Build Docker image
        run: docker build --build-arg RUN_ID="$(cat model_info.txt)" -t mock-model-image .